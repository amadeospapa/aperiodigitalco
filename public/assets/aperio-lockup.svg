<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <!-- Aperio Digital horizontal lockup (dark). Uses Space Grotesk if installed; falls back to a clean sans. -->
  <defs>
    <radialGradient id="lkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="9%" stop-color="#FFF3CE"/>
      <stop offset="30%" stop-color="#F5D976" stop-opacity="0.85"/>
      <stop offset="62%" stop-color="#D4AF37" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lkCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="55%" stop-color="#FFF3CE"/><stop offset="100%" stop-color="#F0C640"/>
    </radialGradient>
  </defs>
  <rect width="900" height="300" fill="#0B0E14"/>
  <!-- icon -->
  <g transform="translate(30,20) scale(0.52)">
    <circle cx="256" cy="238" r="150" fill="url(#lkGlow)"/>
    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M120,400 L256,90 L392,400" stroke="#2E6BFF" stroke-width="15"/>
      <path d="M162,400 L256,164 L350,400" stroke="#4a80ff" stroke-width="13" opacity="0.72"/>
      <path d="M204,400 L256,238 L308,400" stroke="#6b9aff" stroke-width="11" opacity="0.5"/>
    </g>
    <circle cx="256" cy="238" r="8" fill="url(#lkCore)"/>
  </g>
  <!-- wordmark -->
  <text x="312" y="158" font-family="'Space Grotesk','Arial Narrow',Arial,sans-serif" font-weight="700" font-size="92" letter-spacing="4" fill="#F5F6F8">APERIO</text>
  <text x="316" y="205" font-family="'Space Grotesk',Arial,sans-serif" font-weight="500" font-size="40" letter-spacing="24" fill="#9AA3B2">DIGITAL</text>
</svg>
